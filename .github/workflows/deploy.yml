name: Deploy TanStack Start Website

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

       - name: Build Application
        run: |
          npm run build

      - name: Debug Output Folders
        run: |
          echo "=== ROOT DIRECTORY CONTENT ==="
          ls -F
          echo "=== VINXI OR OUTPUT FOLDERS ==="
          ls -R .output .vinxi dist || true

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/client' 
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
