<!DOCTYPE html>
<html lang="en">
  <head>
<script type="text/javascript">
  // Parse the redirect script back into a real browser address route
  (function(l) {
    if (l.search[1] === '_') {
      var decoded = {};
      l.search.slice(1).split('&').forEach(function(v) {
        var pair = v.split('=');
        decoded[pair[0]] = pair.slice(1).join('=').replace(/~and~/g, '&');
      });
      if (decoded._p !== undefined) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (decoded._p ? '/' + decoded._p : '') +
          (decoded._s ? '?' + decoded._s : '') +
          l.hash
        );
      }
    }
  }(window.location));
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Joy Letters</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
